services:
  # Backend service (API and core logic) - V2
  nofx-v2:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.backend
    container_name: nofx-trading-v2
    restart: unless-stopped
    ports:
      - "${NOFX_BACKEND_PORT_V2:-8080}:8080"
    volumes:
      - ./config.json:/app/config.json:ro
      - ./config.db:/app/config.db
      - ./beta_codes.txt:/app/beta_codes.txt:ro
      - ./decision_logs:/app/decision_logs
      - ./prompts:/app/prompts
      - /etc/localtime:/etc/localtime:ro  # Sync host time
    environment:
      - TZ=${NOFX_TIMEZONE:-Asia/Shanghai}  # Set timezone
    networks:
      - nofx-network-v2
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Frontend service (static serving and proxy) - V2
  nofx-frontend-v2:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.frontend
    container_name: nofx-frontend-v2
    restart: unless-stopped
    ports:
      - "${NOFX_FRONTEND_PORT_V2:-80}:80"
      - "443:443"
    volumes:
      - ./nginx/nginx-v2.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - nofx-network-v2
    depends_on:
      - nofx-v2
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

networks:
  nofx-network-v2:
    driver: bridge

